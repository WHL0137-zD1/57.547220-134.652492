<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Обсерватория</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body {
            background: #0a0c12;
            font-family: 'Courier New', monospace;
            color: #bdd4ff;
            overflow-x: hidden;
            padding: 20px;
        }

        .slider {
            width: 100%;
            max-width: 800px;
            margin: 20px auto;
            text-align: center;
            background: rgba(10, 15, 25, 0.6);
            border-radius: 24px;
            padding: 20px;
            border: 1px solid #2a4a6a;
        }

        .slider img {
            width: 100%;
            border-radius: 16px;
            border: 1px solid #3a6a8a;
            box-shadow: 0 0 15px rgba(0,0,0,0.5);
        }

        .slider-buttons {
            margin: 20px 0 10px;
            display: flex;
            gap: 15px;
            justify-content: center;
        }

        .slider-buttons button {
            background: #1a2a3a;
            border: 1px solid #3a6a8a;
            color: #bdd4ff;
            padding: 10px 24px;
            cursor: pointer;
            font-family: monospace;
            font-size: 16px;
            border-radius: 40px;
            transition: 0.2s;
        }

        .slider-buttons button:hover {
            background: #2a3a4a;
            border-color: #6a9aba;
        }

        .instruction {
            text-align: center;
            margin: 15px 0 5px;
            font-size: 13px;
            opacity: 0.8;
        }

        .panorama-link {
            display: none;
            text-align: center;
            margin-top: 30px;
            padding: 20px;
        }

        .panorama-link a {
            background: #1a2a3a;
            border: 1px solid #6a9aba;
            color: #bdd4ff;
            padding: 12px 30px;
            text-decoration: none;
            font-family: monospace;
            font-size: 18px;
            border-radius: 40px;
            transition: 0.2s;
        }

        .panorama-link a:hover {
            background: #2a3a4a;
            text-shadow: 0 0 4px #8db5e5;
        }

        .footer {
            text-align: center;
            font-size: 11px;
            margin-top: 20px;
            color: #5a7a9a;
        }

        hr {
            border-color: #2a4a6a;
            margin: 20px 0;
        }
    </style>
</head>
<body>

<!-- === СЛАЙДЕР С АРХИВНЫМИ КАРТИНКАМИ === -->
<div class="slider" id="slider">
    <img id="sliderImage" src="" alt="Фрагмент архива">
    <div class="slider-buttons">
        <button id="prevBtn">← НАЗАД</button>
        <button id="nextBtn">ДАЛЕЕ →</button>
    </div>
    <div class="instruction">листы архива. найди путь к панораме.</div>
</div>

<!-- === ССЫЛКА НА ПАНОРАМУ (появляется после последней картинки) === -->
<div class="panorama-link" id="panoramaLink">
    <a href="panorama.html" target="_blank">🔭 ПЕРЕЙТИ К ПАНОРАМЕ</a>
    <p style="margin-top: 10px; font-size: 12px;">откроется в новой вкладке</p>
</div>

<div class="footer">
    ⚡ СТАНЦИЯ ПРИЁМА СИГНАЛА
</div>

<script>
    
    const archiveImages = [
        "images/kondyor.jpg",  
        "images/observatoryinrock.png",
        "images/inrock2.png",
        "images/vhod.png"
    ];
    
    let currentIndex = 0;
    const sliderImg = document.getElementById("sliderImage");
    const prevBtn = document.getElementById("prevBtn");
    const nextBtn = document.getElementById("nextBtn");
    const panoramaLink = document.getElementById("panoramaLink");
    
    function updateImage() {
        sliderImg.src = archiveImages[currentIndex];
        
        
        if (currentIndex === archiveImages.length - 1) {
            panoramaLink.style.display = "block";
            nextBtn.textContent = " ЗАВЕРШИТЬ ОСМОТР";
        } else {
            panoramaLink.style.display = "none";
            nextBtn.textContent = "ДАЛЕЕ →";
        }
    }
    
    prevBtn.addEventListener("click", () => {
        if (currentIndex > 0) {
            currentIndex--;
            updateImage();
        }
    });
    
    nextBtn.addEventListener("click", () => {
        if (currentIndex < archiveImages.length - 1) {
            currentIndex++;
            updateImage();
        }
        
    });
    
    
    updateImage();
</script>
</body>
</html>
