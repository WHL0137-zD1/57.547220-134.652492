<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Обсерватория | Архив</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body {
            background: #0a0c12;
            font-family: 'Courier New', monospace;
            color: #bdd4ff;
            overflow-x: hidden;
            padding: 20px;
        }

        
        .slider {
            width: 100%;
            max-width: 800px;
            margin: 20px auto;
            text-align: center;
            background: rgba(10, 15, 25, 0.6);
            border-radius: 24px;
            padding: 20px;
            border: 1px solid #2a4a6a;
        }

        .slider img {
            width: 100%;
            border-radius: 16px;
            border: 1px solid #3a6a8a;
            box-shadow: 0 0 15px rgba(0,0,0,0.5);
        }

        .slider-buttons {
            margin: 20px 0 10px;
            display: flex;
            gap: 15px;
            justify-content: center;
        }

        .slider-buttons button {
            background: #1a2a3a;
            border: 1px solid #3a6a8a;
            color: #bdd4ff;
            padding: 10px 24px;
            cursor: pointer;
            font-family: monospace;
            font-size: 16px;
            border-radius: 40px;
            transition: 0.2s;
        }

        .slider-buttons button:hover {
            background: #2a3a4a;
            border-color: #6a9aba;
        }

        .instruction {
            text-align: center;
            margin: 15px 0 5px;
            font-size: 13px;
            opacity: 0.8;
        }

        /* Панорама (изначально скрыта) */
        .panorama-section {
            display: none;
            margin-top: 30px;
        }

        .panorama-container {
            width: 100%;
            height: 500px;
            position: relative;
            border-top: 2px solid #2a4a6a;
            border-bottom: 2px solid #2a4a6a;
            background: #0a0c12;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        .footer {
            text-align: center;
            font-size: 11px;
            margin-top: 20px;
            color: #5a7a9a;
        }

        
        .instruction-popup {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.85);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .instruction-popup img {
            max-width: 90%;
            max-height: 90%;
            border: 2px solid #6a9aba;
            border-radius: 20px;
            box-shadow: 0 0 30px rgba(0,0,0,0.8);
            cursor: pointer;
        }

        hr {
            border-color: #2a4a6a;
            margin: 20px 0;
        }
    </style>
</head>
<body>


<div class="slider" id="slider">
    <img id="sliderImage" src="observatory_note1.jpg" alt="Фрагмент архива">
    <div class="slider-buttons">
        <button id="prevBtn">← НАЗАД</button>
        <button id="nextBtn" id="nextMainBtn">ДАЛЕЕ →</button>
    </div>
    <div class="instruction">📜 листы архива. найди путь к панораме.</div>
</div>


<div class="panorama-section" id="panoramaSection">
    <div class="panorama-container">
        <iframe src="panorama.html" title="Сферическая панорама обсерватории"></iframe>
    </div>
    <div class="footer">
        ⚡ СТАНЦИЯ ПРИЁМА СИГНАЛА • ВРАЩАЙ ПАНОРАМУ МЫШКОЙ / ПАЛЬЦЕМ
    </div>
</div>


<div id="instructionPopup" class="instruction-popup" style="display: none;">
    <img id="instructionImage" src="" alt="Инструкция">
</div>

<script>
    
    const archiveImages = [
        "kondyor.jpg",
        "observatoryinrock.png",
        "inrock2.jpg",
        "vhod.png"
    ];
    
    
    const instructionImageUrl = "instruction_from_stranger.jpg"; 
    
    
    
    let currentIndex = 0;
    const sliderImg = document.getElementById("sliderImage");
    const prevBtn = document.getElementById("prevBtn");
    const nextBtn = document.getElementById("nextBtn");
    const panoramaSection = document.getElementById("panoramaSection");
    const instructionPopup = document.getElementById("instructionPopup");
    const instructionImg = document.getElementById("instructionImage");
    
    // ОБНОВЛЕНИЕ КАРТИНКИ И СОСТОЯНИЯ КНОПОК
    function updateImage() {
        sliderImg.src = archiveImages[currentIndex];
        
        
        if (currentIndex === archiveImages.length - 1) {
            nextBtn.textContent = "🔭 ПЕРЕЙТИ К ПАНОРАМЕ";
        } else {
            nextBtn.textContent = "ДАЛЕЕ →";
        }
    }
    
    
    prevBtn.addEventListener("click", () => {
        if (currentIndex > 0) {
            currentIndex--;
            updateImage();
            
        }
    });
    
    
    nextBtn.addEventListener("click", () => {
        if (currentIndex < archiveImages.length - 1) {
            
            currentIndex++;
            updateImage();
        } else if (currentIndex === archiveImages.length - 1) {
            
            panoramaSection.style.display = "block";
            
            panoramaSection.scrollIntoView({ behavior: "smooth", block: "start" });
        }
    });
    
   
    window.showInstruction = function(imageUrl) {
        instructionImg.src = imageUrl || instructionImageUrl;
        instructionPopup.style.display = "flex";
    };
    
    
    instructionPopup.addEventListener("click", () => {
        instructionPopup.style.display = "none";
    });
    
    
    window.addEventListener("message", (event) => {
        if (event.data === "ready") {
            
        }
    });
    
    
    updateImage();
</script>


<script>
    
    window.addEventListener("load", () => {
        const iframe = document.querySelector("iframe");
        if (iframe) {
            
            iframe.addEventListener("load", () => {
                
                iframe.contentWindow.postMessage("parentReady", "*");
            });
        }
    });
</script>
</body>
</html>
