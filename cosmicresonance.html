<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Cosmic Resonance | отправка сигнала</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0a0c12;
            font-family: 'Courier New', monospace;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
            background-image: radial-gradient(circle at 20% 30%, #1a2a3a 0%, #0a0c12 100%);
        }

        .cosmic-box {
            max-width: 650px;
            width: 100%;
            background: rgba(10, 15, 25, 0.9);
            backdrop-filter: blur(4px);
            border: 1px solid #5a8aba;
            border-radius: 24px;
            padding: 20px;
            box-shadow: 0 0 30px rgba(0, 50, 80, 0.4);
            transition: all 0.2s;
        }

        h1, h2 {
            color: #aaccee;
            text-align: center;
            font-weight: normal;
            letter-spacing: 2px;
            border-bottom: 1px dashed #4a7a9a;
            width: 100%;
            padding-bottom: 8px;
            margin-top: 0;
        }

        h1 { font-size: 22px; margin-bottom: 15px; }
        h2 { font-size: 16px; margin-top: 20px; margin-bottom: 10px; }

        .status-panel {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 10px 0 15px;
            padding: 10px 15px;
            background: #0f1820;
            border-radius: 40px;
            border: 1px solid #3a6a8a;
        }

        .indicator {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .light {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background-color: #2a4a6a;
            transition: 0.1s;
        }
        .light.green { background-color: #6f6; box-shadow: 0 0 6px #6f6; }
        .light.red { background-color: #f66; box-shadow: 0 0 6px #f66; }

        .status-text { font-size: 12px; letter-spacing: 1px; color: #cceeff; }
        .small-note { font-size: 10px; color: #8aaccc; }

        textarea, input {
            width: 100%;
            background: #0f1820;
            border: 1px solid #3a6a8a;
            color: #e0f0ff;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            padding: 10px;
            margin: 8px 0;
            border-radius: 16px;
        }
        textarea { resize: vertical; }
        input:focus, textarea:focus {
            outline: none;
            border-color: #8db5e5;
            box-shadow: 0 0 5px #5a9aba;
        }

        .button-group {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            justify-content: center;
            margin: 12px 0;
        }

        button {
            background: #1e2f3f;
            border: 1px solid #5a8aba;
            color: #e0f0ff;
            font-family: monospace;
            font-size: 14px;
            padding: 8px 16px;
            cursor: pointer;
            transition: 0.2s;
            border-radius: 40px;
        }
        button:hover:not(:disabled) {
            background: #2e4a6a;
            border-color: #8db5e5;
            text-shadow: 0 0 4px #aaccee;
        }
        button:disabled { opacity: 0.5; cursor: not-allowed; }

        .response-area {
            margin-top: 12px;
            padding: 12px;
            background: #0f1a22;
            border-radius: 16px;
            border-left: 4px solid #6a9aba;
            font-size: 13px;
            white-space: pre-wrap;
            word-break: break-word;
            color: #d0eaff;
        }
        .footer {
            text-align: center;
            margin-top: 20px;
            font-size: 10px;
            color: #8aaccc;
        }
        hr {
            border-color: #3a6a8a;
            margin: 15px 0;
        }

        @keyframes sendPulse {
            0% { text-shadow: 0 0 0 #8db5e5; box-shadow: 0 0 0 0 rgba(100, 200, 255, 0.4); }
            100% { text-shadow: 0 0 6px #8db5e5; box-shadow: 0 0 0 15px rgba(100, 200, 255, 0); }
        }
        .sending { animation: sendPulse 0.4s ease-out; }

        .cooldown-timer {
            font-size: 11px;
            color: #8aaccc;
            text-align: center;
            margin-top: 8px;
        }
    </style>
</head>
<body>
<div class="cosmic-box" id="cosmicBox">
    <h1> COSMIC RESONANCE</h1>
    <div class="status-panel">
        <div class="indicator">
            <div class="light" id="statusLight"></div>
            <span class="status-text" id="statusText">ПРОВЕРКА СВЯЗИ...</span>
        </div>
        <div class="small-note">канал: дальний космос</div>
    </div>

    
    <p style="margin: 5px 0; font-size: 13px; color: #cceeff;">Напиши... Сообещние для своего сигнала.</p>
    <textarea id="cosmicMessage" rows="3" placeholder="Твоё сообщение..."></textarea>
    <div class="button-group">
        <button id="testBtn">📡 ТЕСТ СВЯЗИ</button>
        <button id="sendBtn"> ОТПРАВИТЬ</button>
    </div>
    <div id="sendResponse" class="response-area"></div>
    <div id="cooldownMessage" class="cooldown-timer"></div>

    <hr>

    <!-- ПРОВЕРКА ОТВЕТА -->
    <h2>📡 ПРОВЕРИТЬ ОТВЕТ</h2>
    <input type="text" id="checkCode" placeholder="ЗВЁЗДНЫЙ НОМЕР (например, HD 73124-0426)">
    <button id="checkBtn">🔍 НАЙТИ ОТВЕТ</button>
    <div id="checkResponse" class="response-area"></div>

    <div class="footer">🌠 сигнал уходит со скоростью света • но ответ может прийти не сразу... космос безграничен</div>
</div>

<script>
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwlZA55V1R-N17owF_slHhZjylw-Jlcpi1_NTbXAhdtiMczSmM1GCo70oH4VNU90suO/exec';

    const messageField = document.getElementById('cosmicMessage');
    const testBtn = document.getElementById('testBtn');
    const sendBtn = document.getElementById('sendBtn');
    const sendResponseDiv = document.getElementById('sendResponse');
    const statusLight = document.getElementById('statusLight');
    const statusText = document.getElementById('statusText');
    const cosmicBox = document.getElementById('cosmicBox');
    const cooldownDiv = document.getElementById('cooldownMessage');

    const checkCodeInput = document.getElementById('checkCode');
    const checkBtn = document.getElementById('checkBtn');
    const checkResponseDiv = document.getElementById('checkResponse');

    
    const COOLDOWN_HOURS = 24;
    const STORAGE_KEY = 'cosmic_last_send';

    function getRemainingCooldown() {
        const lastSend = localStorage.getItem(STORAGE_KEY);
        if (!lastSend) return 0;
        const diff = Date.now() - parseInt(lastSend);
        const cooldownMs = COOLDOWN_HOURS * 60 * 60 * 1000;
        return Math.max(0, cooldownMs - diff);
    }

    function updateCooldownUI() {
        const remaining = getRemainingCooldown();
        if (remaining > 0) {
            const hours = Math.floor(remaining / (60 * 60 * 1000));
            const minutes = Math.floor((remaining % (60 * 60 * 1000)) / (60 * 1000));
            sendBtn.disabled = true;
            cooldownDiv.innerHTML = `⏳ передатчик заряжается: ${hours}ч ${minutes}мин до нового сигнала`;
        } else {
            sendBtn.disabled = false;
            cooldownDiv.innerHTML = '';
        }
    }

    function markSend() {
        localStorage.setItem(STORAGE_KEY, Date.now().toString());
        updateCooldownUI();
    }

    // === ИНДИКАТОР СВЯЗИ (светлее) ===
    async function updateConnectionStatus() {
        try {
            const response = await fetch(SCRIPT_URL, {
                method: 'POST',
                body: JSON.stringify({ ping: true })
            });
            if (response.ok) {
                statusLight.className = 'light green';
                statusText.innerHTML = 'СВЯЗЬ: АКТИВНА';
                statusText.style.color = '#ccffcc';
            } else throw new Error();
        } catch (e) {
            statusLight.className = 'light red';
            statusText.innerHTML = 'СВЯЗЬ: ПОТЕРЯНА';
            statusText.style.color = '#ffcccc';
        }
    }

    updateConnectionStatus();
    setInterval(updateConnectionStatus, 20000);
    updateCooldownUI();

    function showResponse(div, text, isError = false) {
        div.innerHTML = `<span style="${isError ? 'color:#ffaa88' : 'color:#e0ffc0'}">${text}</span>`;
        setTimeout(() => {
            if (div.innerHTML === `<span style="${isError ? 'color:#ffaa88' : 'color:#e0ffc0'}">${text}</span>`) {
                div.innerHTML = '';
            }
        }, 10000);
    }

    function animateSend() {
        cosmicBox.classList.add('sending');
        setTimeout(() => cosmicBox.classList.remove('sending'), 400);
    }

    // === ТЕСТ ===
    testBtn.addEventListener('click', async () => {
        testBtn.disabled = true;
        showResponse(sendResponseDiv, "📡 Тестовый сигнал...");
        try {
            const response = await fetch(SCRIPT_URL, {
                method: 'POST',
                body: JSON.stringify({ message: '[PING]', test: true })
            });
            if (response.ok) showResponse(sendResponseDiv, "✅ Тест пройден. Канал открыт.");
            else showResponse(sendResponseDiv, "❌ Тест не удался.", true);
        } catch (error) {
            showResponse(sendResponseDiv, "❌ Ошибка теста.", true);
        }
        testBtn.disabled = false;
    });

    // === ОТПРАВКА С ПЕРЕЗАРЯДКОЙ ===
    sendBtn.addEventListener('click', async () => {
        if (getRemainingCooldown() > 0) {
            showResponse(sendResponseDiv, "Передатчик ещё заряжается. Вернись позже.", true);
            return;
        }

        const message = messageField.value.trim();
        if (!message) {
            showResponse(sendResponseDiv, "Поле пусто. Напиши что-нибудь...", true);
            return;
        }

        sendBtn.disabled = true;
        animateSend();

        try {
            const response = await fetch(SCRIPT_URL, {
                method: 'POST',
                body: JSON.stringify({ message: message })
            });
            const result = await response.json();
            if (result.success) {
                showResponse(sendResponseDiv, `СООБЩЕНИЕ ОТПРАВЛЕНО В КОСМОС<br><br>Твой звёздный номер: <strong>${result.code}</strong><br><br>Сохрани его. Может, кто-то услышит.`);
                messageField.value = '';
                markSend(); 
            } else {
                showResponse(sendResponseDiv, "❌ Ошибка отправки. Попробуй ещё раз.", true);
                sendBtn.disabled = false;
            }
        } catch (error) {
            showResponse(sendResponseDiv, "❌ Ошибка соединения. Сигнал не ушёл.", true);
            sendBtn.disabled = false;
        }

        updateCooldownUI();
    });

    // === ПРОВЕРКА ОТВЕТА ===
    checkBtn.addEventListener('click', async () => {
        const code = checkCodeInput.value.trim();
        if (!code) {
            showResponse(checkResponseDiv, "Введи звёздный номер.", true);
            return;
        }
        checkBtn.disabled = true;
        showResponse(checkResponseDiv, "🔍 Поиск ответа...");
        try {
            const response = await fetch(SCRIPT_URL, {
                method: 'POST',
                body: JSON.stringify({ checkCode: code })
            });
            const result = await response.json();
            if (result.hasResponse) {
                showResponse(checkResponseDiv, `📡 ПОЛУЧЕН РЕЗОНАНС ИЗ КОСМОСА:<br><br>${result.response}`);
            } else if (result.error) {
                showResponse(checkResponseDiv, "❌ Ошибка проверки.", true);
            } else {
                showResponse(checkResponseDiv, "Ответа пока нет. Сигнал ещё в пути. Загляни... когда-нибудь.");
            }
        } catch (error) {
            showResponse(checkResponseDiv, "❌ Ошибка соединения.", true);
        }
        checkBtn.disabled = false;
    });
</script>
</body>
</html>
