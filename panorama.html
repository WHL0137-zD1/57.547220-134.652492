<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Панорама обсерватории</title>
    <style>
        body { margin: 0; overflow: hidden; background: #0a0c12; }
        canvas { display: block; }
        .hotspot {
            position: absolute;
            background: rgba(100, 200, 255, 0.2);
            border: 2px solid #6af;
            border-radius: 12px;
            cursor: pointer;
            transition: 0.2s;
            z-index: 10;
        }
        .hotspot:hover {
            background: rgba(100, 200, 255, 0.5);
            box-shadow: 0 0 12px #6af;
        }
        .tooltip {
            position: absolute;
            background: #0a1a2a;
            color: #bdd4ff;
            padding: 5px 10px;
            border-radius: 8px;
            font-size: 12px;
            font-family: monospace;
            pointer-events: none;
            white-space: nowrap;
            transform: translate(-50%, -120%);
            border: 1px solid #6af;
        }
    </style>
</head>
<body>
    <div id="hotspot1" class="hotspot" style="top: 40%; left: 25%; width: 120px; height: 80px;"></div>
    <div id="hotspot2" class="hotspot" style="top: 60%; left: 70%; width: 100px; height: 100px;"></div>

    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
    <script>
        // === НАСТРОЙКИ ===
        const panoramaImage = "panorama.jpg";
        
        // Инициализация сцены
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);
        
        // Создаём сферу и натягиваем панораму
        const geometry = new THREE.SphereGeometry(500, 64, 64);
        const texture = new THREE.TextureLoader().load(panoramaImage);
        const material = new THREE.MeshBasicMaterial({ map: texture, side: THREE.BackSide });
        const sphere = new THREE.Mesh(geometry, material);
        scene.add(sphere);
        
        // Управление (мышка/палец)
        let isDragging = false;
        let lastX = 0;
        let rotationY = 0;
        let rotationX = 0;
        
        renderer.domElement.addEventListener('mousedown', (e) => {
            isDragging = true;
            lastX = e.clientX;
        });
        window.addEventListener('mousemove', (e) => {
            if (!isDragging) return;
            const delta = e.clientX - lastX;
            rotationY += delta * 0.005;
            sphere.rotation.y = rotationY;
            lastX = e.clientX;
        });
        window.addEventListener('mouseup', () => { isDragging = false; });
        
        // Для сенсорных экранов
        renderer.domElement.addEventListener('touchstart', (e) => {
            isDragging = true;
            lastX = e.touches[0].clientX;
        });
        window.addEventListener('touchmove', (e) => {
            if (!isDragging) return;
            const delta = e.touches[0].clientX - lastX;
            rotationY += delta * 0.005;
            sphere.rotation.y = rotationY;
            lastX = e.touches[0].clientX;
        });
        window.addEventListener('touchend', () => { isDragging = false; });
        
        // Анимация
        function animate() {
            requestAnimationFrame(animate);
            renderer.render(scene, camera);
        }
        animate();
        
        // === КЛИКАБЕЛЬНЫЕ ЗОНЫ ===
        const hotspot1 = document.getElementById('hotspot1');
        const hotspot2 = document.getElementById('hotspot2');
        
        hotspot1.addEventListener('click', () => {
            alert("Записка:\n«Этот аппарат — «Cosmic Resonance». Он отправляет сигнал в открытый космос... Обратного сигнала может не быть.\n\nТестовая передача не тратит сеанс. Используй её, чтобы убедиться, что связь есть.\n\nОбъяснять для чего это нужно не буду. Наверняка ты уже и сам всё знаешь. Удачи.»");
        });
        
        hotspot2.addEventListener('click', () => {
            window.location.href = "cosmicresonance.html";
        });
        
        // Подсказки при наведении
        hotspot1.title = "Записка (инструкция)";
        hotspot2.title = "Аппарат Cosmic Resonance →";
    </script>
</body>
</html>
