<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Панорама обсерватории</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Courier New', monospace;
        }
       
        .hint {
            position: absolute;
            bottom: 15px;
            left: 15px;
            color: #aaccee;
            background: rgba(0,0,0,0.5);
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 12px;
            z-index: 20;
            pointer-events: none;
        }
        
        .instruction-popup {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.85);
            justify-content: center;
            align-items: center;
            z-index: 1000;
            font-family: monospace;
        }
        .instruction-popup img {
            max-width: 80%;
            max-height: 80%;
            border: 2px solid #6a9aba;
            border-radius: 20px;
            box-shadow: 0 0 30px rgba(0,0,0,0.8);
            cursor: pointer;
        }
        .close-hint {
            position: absolute;
            bottom: 20px;
            left: 0;
            width: 100%;
            text-align: center;
            color: #aaccee;
            font-size: 12px;
        }
        /* Курсор-прицел для зон */
        .raycaster-target {
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="hint">🔍 осмотрись (тяни мышкой / пальцем) | найди сияющие зоны</div>

    <div id="instructionPopup" class="instruction-popup">
        <img id="instructionImage" src="instruction_from_siluet.jpg" alt="Инструкция">
        <div class="close-hint">⚡ нажми на картинку, чтобы закрыть</div>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.128.0/build/three.module.js"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';

        
        const panoramaImage = "images/panorama.jpg";
        const imgWidth = 4000;
        const imgHeight = 2000;
        

        function pixelToAngles(x, y) {
            const lon = (x / imgWidth) * Math.PI * 2;
            const lat = (y / imgHeight) * Math.PI - Math.PI / 2;
            return { lon, lat };
        }
        
        
        const zones = [
            { type: "instruction", coords: [[897,1434], [1149,1651]] },
            { type: "device", coords: [[1046,1229], [1223,1480]] }
        ];
        
        
        function getZoneAngles(coords) {
            let sumLon = 0, sumLat = 0;
            for (let c of coords) {
                const { lon, lat } = pixelToAngles(c[0], c[1]);
                sumLon += lon;
                sumLat += lat;
            }
            return { lon: sumLon / coords.length, lat: sumLat / coords.length };
        }
        
        const instructionAngles = getZoneAngles(zones[0].coords);
        const deviceAngles = getZoneAngles(zones[1].coords);
        
       
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);
        
        
        const geometry = new THREE.SphereGeometry(500, 64, 64);
        const texture = new THREE.TextureLoader().load(panoramaImage);
        const material = new THREE.MeshBasicMaterial({ map: texture, side: THREE.BackSide });
        const sphere = new THREE.Mesh(geometry, material);
        scene.add(sphere);
        
        
        function createHotspot(lon, lat, radius = 0.3, type) {
           
            const x = 500 * Math.cos(lat) * Math.sin(lon);
            const y = 500 * Math.sin(lat);
            const z = 500 * Math.cos(lat) * Math.cos(lon);
            const hotspotGeo = new THREE.SphereGeometry(radius, 16, 16);
            const hotspotMat = new THREE.MeshBasicMaterial({ color: 0x33aaff, transparent: true, opacity: 0.4 });
            const hotspot = new THREE.Mesh(hotspotGeo, hotspotMat);
            hotspot.position.set(x, y, z);
            hotspot.userData = { type: type };
            scene.add(hotspot);
            return hotspot;
        }
        
        const instructionHotspot = createHotspot(instructionAngles.lon, instructionAngles.lat, 0.4, "instruction");
        const deviceHotspot = createHotspot(deviceAngles.lon, deviceAngles.lat, 0.4, "device");
        
       
        let isDragging = false;
        let lastX = 0, lastY = 0;
        let rotationX = 0, rotationY = 0;
        
        renderer.domElement.addEventListener('mousedown', (e) => {
            isDragging = true;
            lastX = e.clientX;
            lastY = e.clientY;
        });
        window.addEventListener('mousemove', (e) => {
            if (!isDragging) return;
            const deltaX = e.clientX - lastX;
            const deltaY = e.clientY - lastY;
            rotationY += deltaX * 0.005;
            rotationX += deltaY * 0.005;
            
            rotationX = Math.max(-Math.PI / 2.2, Math.min(Math.PI / 2.2, rotationX));
            sphere.rotation.x = rotationX;
            sphere.rotation.y = rotationY;
            lastX = e.clientX;
            lastY = e.clientY;
        });
        window.addEventListener('mouseup', () => { isDragging = false; });
        
        
        renderer.domElement.addEventListener('touchstart', (e) => {
            isDragging = true;
            lastX = e.touches[0].clientX;
            lastY = e.touches[0].clientY;
            e.preventDefault();
        });
        window.addEventListener('touchmove', (e) => {
            if (!isDragging) return;
            const deltaX = e.touches[0].clientX - lastX;
            const deltaY = e.touches[0].clientY - lastY;
            rotationY += deltaX * 0.005;
            rotationX += deltaY * 0.005;
            rotationX = Math.max(-Math.PI / 2.2, Math.min(Math.PI / 2.2, rotationX));
            sphere.rotation.x = rotationX;
            sphere.rotation.y = rotationY;
            lastX = e.touches[0].clientX;
            lastY = e.touches[0].clientY;
        });
        window.addEventListener('touchend', () => { isDragging = false; });
        
        
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();
        
        function onClick(event) {
           
            mouse.x = (event.clientX / renderer.domElement.clientWidth) * 2 - 1;
            mouse.y = -(event.clientY / renderer.domElement.clientHeight) * 2 + 1;
            
            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects([instructionHotspot, deviceHotspot]);
            
            if (intersects.length > 0) {
                const hit = intersects[0].object;
                const type = hit.userData.type;
                
                if (type === "instruction") {
                    const popup = document.getElementById('instructionPopup');
                    popup.style.display = 'flex';
                } else if (type === "device") {
                    window.location.href = "cosmicresonance.html";
                }
            }
        }
        
        renderer.domElement.addEventListener('click', onClick);
        
        
        function animate() {
            requestAnimationFrame(animate);
            renderer.render(scene, camera);
        }
        animate();
        
        console.log("🔭 Панорама загружена. Синие области (направления),  нужны чтобы взаимодействовать.");
        
        const popup = document.getElementById('instructionPopup');
        popup.addEventListener('click', () => {
            popup.style.display = 'none';
        });
    </script>
</body>
</html>
