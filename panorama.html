<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Панорама обсерватории</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: #0a0c12;
            font-family: 'Courier New', monospace;
        }
        
        
        .info {
            position: fixed;
            bottom: 15px;
            left: 15px;
            color: #8db5e5;
            background: rgba(0,0,0,0.6);
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 12px;
            z-index: 10;
            pointer-events: none;
        }
        
        
        .status {
            position: fixed;
            bottom: 15px;
            right: 15px;
            color: #aaccee;
            background: rgba(0,0,0,0.5);
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 11px;
            z-index: 10;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div class="info">🖱️ тяни мышкой / пальцем, чтобы осмотреться</div>
    <div class="status" id="status">⚡ панорама загружается...</div>

    
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.128.0/build/three.module.js"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';

        const panoramaImage = 'images/panorama.jpg';
        
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);
        
        // Загружаем панораму
        const texture = new THREE.TextureLoader().load(panoramaImage, 
            () => { document.getElementById('status').innerHTML = '⚡ панорама готова • ищи зоны'; },
            undefined,
            (err) => { console.error('Ошибка загрузки панорамы:', err); document.getElementById('status').innerHTML = '❌ не удалось загрузить панораму'; }
        );
        const geometry = new THREE.SphereGeometry(500, 64, 64);
        const material = new THREE.MeshBasicMaterial({ map: texture, side: THREE.BackSide });
        const sphere = new THREE.Mesh(geometry, material);
        scene.add(sphere);
        
        
        let isDragging = false;
        let lastX = 0;
        let rotationY = 0;
        
        renderer.domElement.addEventListener('mousedown', (e) => {
            isDragging = true;
            lastX = e.clientX;
            renderer.domElement.style.cursor = 'grabbing';
        });
        
        window.addEventListener('mousemove', (e) => {
            if (!isDragging) return;
            const delta = e.clientX - lastX;
            rotationY += delta * 0.005;
            sphere.rotation.y = rotationY;
            lastX = e.clientX;
        });
        
        window.addEventListener('mouseup', () => {
            isDragging = false;
            renderer.domElement.style.cursor = 'grab';
        });
        
        
        renderer.domElement.addEventListener('touchstart', (e) => {
            isDragging = true;
            lastX = e.touches[0].clientX;
            e.preventDefault();
        });
        
        window.addEventListener('touchmove', (e) => {
            if (!isDragging) return;
            const delta = e.touches[0].clientX - lastX;
            rotationY += delta * 0.005;
            sphere.rotation.y = rotationY;
            lastX = e.touches[0].clientX;
            e.preventDefault();
        });
        
        window.addEventListener('touchend', () => {
            isDragging = false;
        });
        
        // Анимация
        function animate() {
            requestAnimationFrame(animate);
            renderer.render(scene, camera);
        }
        animate();
        

        const btnStyle = {
            position: 'fixed',
            padding: '12px 24px',
            background: 'rgba(26, 42, 58, 0.85)',
            border: '2px solid #6a9aba',
            color: '#e0f0ff',
            fontFamily: 'Courier New, monospace',
            fontSize: '16px',
            cursor: 'pointer',
            borderRadius: '40px',
            backdropFilter: 'blur(4px)',
            transition: '0.2s',
            zIndex: 20,
            textShadow: '0 0 3px #2a6a8a'
        };
        
        
        const btnInstruction = document.createElement('button');
        btnInstruction.textContent = 'ЗАПИСКА';
        Object.assign(btnInstruction.style, btnStyle);
        btnInstruction.style.left = '20px';
        btnInstruction.style.bottom = '80px';
        btnInstruction.onmouseover = () => btnInstruction.style.background = 'rgba(46, 74, 106, 0.9)';
        btnInstruction.onmouseout = () => btnInstruction.style.background = 'rgba(26, 42, 58, 0.85)';
        btnInstruction.onclick = () => {
            alert("📜 ЗАПИСКА ОТ СИЛУЭТА:\n\n«Этот аппарат — «Cosmic Resonance». Он отправляет сигнал в открытый космос. Сообщение достигнет цели через неделю... Или никогда.\n\nТестовая передача не тратит сеанс. Используй её, чтобы убедиться, что связь есть.\n\nКогда будешь готов — напиши. Не важно, что. Важно, что ты здесь.»");
        };
        document.body.appendChild(btnInstruction);
        
        
        const btnDevice = document.createElement('button');
        btnDevice.textContent = ' АППАРАТ COSMIC RESONANCE';
        Object.assign(btnDevice.style, btnStyle);
        btnDevice.style.right = '20px';
        btnDevice.style.bottom = '80px';
        btnDevice.onmouseover = () => btnDevice.style.background = 'rgba(46, 74, 106, 0.9)';
        btnDevice.onmouseout = () => btnDevice.style.background = 'rgba(26, 42, 58, 0.85)';
        btnDevice.onclick = () => {
            window.location.href = 'cosmicresonance.html';
        };
        document.body.appendChild(btnDevice);
        
        
        renderer.domElement.style.cursor = 'grab';
        
        
        setTimeout(() => {
            const statusDiv = document.getElementById('status');
            if (statusDiv) statusDiv.innerHTML = '🔘 нажми на кнопку с инструкцией или аппаратом';
        }, 1000);
    </script>
</body>
</html>
