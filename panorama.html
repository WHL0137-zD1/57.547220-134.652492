<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Панорама обсерватории</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Courier New', monospace;
        }
       
        .action-panel {
            position: fixed;
            bottom: 30px;
            right: 20px;
            display: flex;
            gap: 15px;
            z-index: 100;
            opacity: 0;
            transition: opacity 1s ease;
            pointer-events: none;
        }
        .action-panel.visible {
            opacity: 1;
            pointer-events: auto;
        }
        .action-btn {
            background: #1a2a3a;
            border: 2px solid #6a9aba;
            color: #bdd4ff;
            font-family: monospace;
            font-size: 16px;
            padding: 12px 24px;
            border-radius: 60px;
            cursor: pointer;
            backdrop-filter: blur(4px);
            transition: 0.2s;
            font-weight: bold;
            letter-spacing: 1px;
        }
        .action-btn:hover {
            background: #2a4a6a;
            border-color: #8db5e5;
            text-shadow: 0 0 5px #8db5e5;
            transform: scale(1.02);
        }
        
        .instruction-popup {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.85);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .instruction-popup img {
            max-width: 80%;
            max-height: 80%;
            border: 2px solid #6a9aba;
            border-radius: 20px;
            box-shadow: 0 0 30px rgba(0,0,0,0.8);
            cursor: pointer;
        }
        .close-hint {
            position: absolute;
            bottom: 20px;
            left: 0;
            width: 100%;
            text-align: center;
            color: #aaccee;
            font-size: 12px;
        }
        
        .hint {
            position: fixed;
            bottom: 15px;
            left: 15px;
            color: #aaccee;
            background: rgba(0,0,0,0.5);
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 11px;
            z-index: 20;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div class="hint">🔍 осматривай обсерваторию (тяни мышкой / пальцем)</div>

    <div class="action-panel" id="actionPanel">
        <button class="action-btn" id="instructionBtn">📜 ИНСТРУКЦИЯ</button>
        <button class="action-btn" id="deviceBtn">📡 АППАРАТ</button>
    </div>

    <div id="instructionPopup" class="instruction-popup">
        <img id="instructionImage" src="images/instruction.png" alt="Инструкция">
        <div class="close-hint">⚡ нажми на картинку, чтобы закрыть</div>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.128.0/build/three.module.js"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';

        
        const panoramaImage = "images/panorama.jpg";
        
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);
        
        
        const geometry = new THREE.SphereGeometry(500, 64, 64);
        const texture = new THREE.TextureLoader().load(panoramaImage);
        const material = new THREE.MeshBasicMaterial({ map: texture, side: THREE.BackSide });
        const sphere = new THREE.Mesh(geometry, material);
        scene.add(sphere);
        
        
        let isDragging = false;
        let lastX = 0, lastY = 0;
        let rotationX = 0, rotationY = 0;
        
        renderer.domElement.addEventListener('mousedown', (e) => {
            isDragging = true;
            lastX = e.clientX;
            lastY = e.clientY;
        });
        window.addEventListener('mousemove', (e) => {
            if (!isDragging) return;
            const deltaX = e.clientX - lastX;
            const deltaY = e.clientY - lastY;
            rotationY += deltaX * 0.005;
            rotationX += deltaY * 0.005;
            rotationX = Math.max(-Math.PI / 2.2, Math.min(Math.PI / 2.2, rotationX));
            sphere.rotation.x = rotationX;
            sphere.rotation.y = rotationY;
            lastX = e.clientX;
            lastY = e.clientY;
        });
        window.addEventListener('mouseup', () => { isDragging = false; });
        
        
        renderer.domElement.addEventListener('touchstart', (e) => {
            isDragging = true;
            lastX = e.touches[0].clientX;
            lastY = e.touches[0].clientY;
            e.preventDefault();
        });
        window.addEventListener('touchmove', (e) => {
            if (!isDragging) return;
            const deltaX = e.touches[0].clientX - lastX;
            const deltaY = e.touches[0].clientY - lastY;
            rotationY += deltaX * 0.005;
            rotationX += deltaY * 0.005;
            rotationX = Math.max(-Math.PI / 2.2, Math.min(Math.PI / 2.2, rotationX));
            sphere.rotation.x = rotationX;
            sphere.rotation.y = rotationY;
            lastX = e.touches[0].clientX;
            lastY = e.touches[0].clientY;
        });
        window.addEventListener('touchend', () => { isDragging = false; });
        
        function animate() {
            requestAnimationFrame(animate);
            renderer.render(scene, camera);
        }
        animate();
        
        
        setTimeout(() => {
            document.getElementById('actionPanel').classList.add('visible');
        }, 3000);
        
        
        const instructionBtn = document.getElementById('instructionBtn');
        const deviceBtn = document.getElementById('deviceBtn');
        const popup = document.getElementById('instructionPopup');
        
        instructionBtn.addEventListener('click', () => {
            popup.style.display = 'flex';
        });
        
        deviceBtn.addEventListener('click', () => {
            window.location.href = "cosmicresonance.html";
        });
        
        
        popup.addEventListener('click', () => {
            popup.style.display = 'none';
        });
        
        console.log("🔭 Панорама загружена. Кнопки появятся через 3 секунды.");
    </script>
</body>
</html>
