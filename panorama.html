<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Панорама обсерватории</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Courier New', monospace;
        }
       
        .hotspot {
            position: absolute;
            background: rgba(100, 200, 255, 0.2);
            border: 2px solid #6af;
            border-radius: 12px;
            cursor: pointer;
            transition: 0.2s;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #aaf;
            font-size: 14px;
            backdrop-filter: blur(4px);
        }
        .hotspot:hover {
            background: rgba(100, 200, 255, 0.5);
            border-color: #fff;
            box-shadow: 0 0 12px #6af;
        }
        
        .instruction-popup {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.85);
            justify-content: center;
            align-items: center;
            z-index: 1000;
            font-family: monospace;
        }
        .instruction-popup img {
            max-width: 80%;
            max-height: 80%;
            border: 2px solid #6a9aba;
            border-radius: 20px;
            box-shadow: 0 0 30px rgba(0,0,0,0.8);
            cursor: pointer;
        }
        .close-hint {
            position: absolute;
            bottom: 20px;
            left: 0;
            width: 100%;
            text-align: center;
            color: #aaccee;
            font-size: 12px;
        }
    </style>
</head>
<body>
    
    <div id="instructionZone" class="hotspot" style="top: 30%; left: 15%; width: 160px; height: 60px;">
        📜 ИНСТРУКЦИЯ
    </div>
    <div id="deviceZone" class="hotspot" style="top: 60%; left: 70%; width: 180px; height: 60px;">
        📡 АППАРАТ
    </div>

    <!-- Попап для инструкции -->
    <div id="instructionPopup" class="instruction-popup">
        <img id="instructionImage" src="instruction_from_siluet.jpg" alt="Инструкция">
        <div class="close-hint">⚡ нажми на картинку, чтобы закрыть</div>
    </div>

    <!-- Подключаем Three.js из CDN -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.128.0/build/three.module.js"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';

        
        const panoramaImage = "images/panorama.jpg";
        
        
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);
        
        
        const geometry = new THREE.SphereGeometry(500, 64, 64);
        const texture = new THREE.TextureLoader().load(panoramaImage);
        const material = new THREE.MeshBasicMaterial({ map: texture, side: THREE.BackSide });
        const sphere = new THREE.Mesh(geometry, material);
        scene.add(sphere);
        
        
        let isDragging = false;
        let lastX = 0;
        let rotationY = 0;
        
        renderer.domElement.addEventListener('mousedown', (e) => {
            isDragging = true;
            lastX = e.clientX;
        });
        window.addEventListener('mousemove', (e) => {
            if (!isDragging) return;
            const delta = e.clientX - lastX;
            rotationY += delta * 0.005;
            sphere.rotation.y = rotationY;
            lastX = e.clientX;
        });
        window.addEventListener('mouseup', () => { isDragging = false; });
        
        
        renderer.domElement.addEventListener('touchstart', (e) => {
            isDragging = true;
            lastX = e.touches[0].clientX;
            e.preventDefault();
        });
        window.addEventListener('touchmove', (e) => {
            if (!isDragging) return;
            const delta = e.touches[0].clientX - lastX;
            rotationY += delta * 0.005;
            sphere.rotation.y = rotationY;
            lastX = e.touches[0].clientX;
        });
        window.addEventListener('touchend', () => { isDragging = false; });
        
        
        function animate() {
            requestAnimationFrame(animate);
            renderer.render(scene, camera);
        }
        animate();
        
        
        const instructionZone = document.getElementById('instructionZone');
        const deviceZone = document.getElementById('deviceZone');
        const popup = document.getElementById('instructionPopup');
        const instructionImg = document.getElementById('instructionImage');
        
        // Открыть инструкцию
        instructionZone.addEventListener('click', () => {
            popup.style.display = 'flex';
        });
        
        
        deviceZone.addEventListener('click', () => {
            window.location.href = "cosmicresonance.html";
        });
        
       
        popup.addEventListener('click', () => {
            popup.style.display = 'none';
        });
        

        console.log("🔭 Панорама загружена. Наведи на синие зоны и нажми.");
        
        
        const hint = document.createElement('div');
        hint.innerText = "🔍 наведи на синие области";
        hint.style.position = "absolute";
        hint.style.bottom = "15px";
        hint.style.left = "15px";
        hint.style.color = "#aaccee";
        hint.style.backgroundColor = "rgba(0,0,0,0.5)";
        hint.style.padding = "5px 12px";
        hint.style.borderRadius = "20px";
        hint.style.fontSize = "12px";
        hint.style.fontFamily = "monospace";
        hint.style.zIndex = "20";
        document.body.appendChild(hint);
    </script>
</body>
</html>
